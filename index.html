<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ead8">
<title>슬기로운 신입생활</title>
<meta name="description" content="신입직원 교육 메뉴 — AI 상황극">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="home-header">
  <a class="admin-btn" href="admin.html" aria-label="관리자" title="관리자">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9.5 12.5l1.8 1.8 3.4-3.6"/></svg>
  </a>
  <div class="wrap hero">
    <div class="hero-copy">
      <p class="eyebrow">신입직원 교육</p>
      <h1>슬기로운<br><em>신입생활</em></h1>
      <p>오늘 함께할 메뉴를 골라 주세요.</p>
    </div>
    <img class="hero-rookie" src="assets/mobile/rookie/idle.gif" width="320" height="384" alt="">
  </div>
</header>

<main class="wrap">
  <div class="section-title">
    <h2>메뉴</h2>
    <span id="menu-count"></span>
  </div>
  <ul class="menu-grid" id="menu-grid"></ul>
</main>

<footer class="foot">
  <span class="chip" id="anon-code">익명 참여</span>
</footer>

<script src="js/config.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/api.js"></script>
<script>
(function () {
  const menus = (window.APP_CONFIG.MENUS || []);
  const grid = document.getElementById('menu-grid');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function art(m) {
    if (m.status !== 'open') return '<div class="menu-art" aria-hidden="true"><span>✦</span></div>';
    if (m.art === 'trio') {
      return '<div class="menu-art"><span class="tag">' + esc(m.badge) + '</span><div class="trio">' +
        ['customer', 'manager', 'colleague'].map(id =>
          '<img src="assets/mobile/' + id + '/idle.gif" width="320" height="384" alt="" loading="lazy">').join('') +
        '</div></div>';
    }
    if (m.art === 'sea') {
      return '<div class="menu-art sea-art"><span class="tag">' + esc(m.badge) + '</span>' +
        '<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
        '<rect width="320" height="200" fill="#cfeaf7"/><circle cx="252" cy="52" r="24" fill="#ffd166" stroke="#1d2b45" stroke-width="3"/>' +
        '<path d="M40 112h96l-12 16H52z" fill="#f08a4b" stroke="#1d2b45" stroke-width="3" stroke-linejoin="round"/>' +
        '<rect x="70" y="90" width="30" height="22" rx="3" fill="#fffdf7" stroke="#1d2b45" stroke-width="3"/><path d="M85 90V74l14 5-14 5" fill="#2f7f86" stroke="#1d2b45" stroke-width="3" stroke-linejoin="round"/>' +
        '<path d="M0 132q20-12 40 0t40 0 40 0 40 0 40 0 40 0 40 0 40 0V200H0z" fill="#5ab4e5" stroke="#1d2b45" stroke-width="3"/>' +
        '<path d="M0 156q20-10 40 0t40 0 40 0 40 0 40 0 40 0 40 0 40 0V200H0z" fill="#1f6fb2"/>' +
        '<path d="M168 70c18-26 52-30 74-8" fill="none" stroke="#e04a3f" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 12"/>' +
        '<g transform="translate(196 96) rotate(35)"><rect x="-7" y="-46" width="14" height="70" rx="3" fill="#ffd166" stroke="#1d2b45" stroke-width="3"/><path d="M-7 24h14l-7 16z" fill="#f3d9b0" stroke="#1d2b45" stroke-width="3" stroke-linejoin="round"/><path d="M-3 33h6l-3 7z" fill="#1d2b45"/></g>' +
        '</svg></div>';
    }
    if (m.image) return '<div class="menu-art"><span class="tag">' + esc(m.badge) + '</span><img src="' + esc(m.image) + '" alt="" style="width:100%;height:100%;object-fit:cover"></div>';
    return '<div class="menu-art"><span class="tag">' + esc(m.badge) + '</span></div>';
  }

  grid.innerHTML = menus.map(m => {
    const body = art(m) + '<div class="menu-body"><h3>' + esc(m.title) + '</h3><p>' + esc(m.desc) + '</p>' +
      '<span class="menu-go">' + (m.status === 'open' ? '시작하기 →' : '준비 중') + '</span></div>';
    return m.status === 'open'
      ? '<li><a class="menu-card" href="' + esc(m.href) + '">' + body + '</a></li>'
      : '<li><div class="menu-card soon" aria-disabled="true">' + body + '</div></li>';
  }).join('');

  const open = menus.filter(m => m.status === 'open').length;
  document.getElementById('menu-count').textContent = '참여 가능 ' + open + '개';
  document.getElementById('anon-code').textContent = '익명 참여 · ' + API.participantId();
})();
</script>
</body>
</html>
